[project]
name = "statement-rater"
version = "0.1.0"
description = "Crowdsourced equivalence rating for statement alignment (Wikimedia OAuth, Toolforge-ready)"
requires-python = ">=3.11"
dependencies = [
    "Flask>=3.0",
    "Flask-SQLAlchemy>=3.1",
    "requests>=2.31",
]

[project.optional-dependencies]
# Only needed when deploying against the Toolforge MariaDB replica.
prod = ["pymysql>=1.1"]

[tool.uv]
package = false
