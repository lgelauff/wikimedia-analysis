<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ tool_name }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') }}">Statement equivalence rating</a>
    <nav>
      {% if is_superadmin %}<a href="{{ url_for('admin.stats') }}">Stats</a>{% endif %}
      {% if current_username %}
        <span class="user">{{ current_username }}</span>
        <form method="post" action="{{ url_for('logout') }}" class="inline">
          <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
          <button class="linklike" type="submit">Log out</button>
        </form>
      {% endif %}
    </nav>
  </header>
  <main>{% block content %}{% endblock %}</main>
</body>
</html>
